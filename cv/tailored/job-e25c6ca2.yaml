      - Construí la generación nocturna de índices de búsqueda con orquestaciones de Azure Durable Functions, con procesamiento por lotes basado en cursores, fan-out reanudable con ContinueAsNew y una protección de idempotencia contra reconstrucciones duplicadas.
      - Moví los secretos de la aplicación a Azure Key Vault y agregué un caché de secretos de Key Vault con TTL y un caché de geo-IP.
