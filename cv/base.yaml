    EDUCATION:
      - institution: Universidad Nacional Mayor de San Marcos
        area: Bachelor’s Degree in Software Engineering
        location: Lima, Peru
        date: 2020 - 2024
        highlights:
          - Ranked in the top 10 in the Faculty of Systems Engineering and Informatics.
          - Second place in the Eneisoft Hackathon for an educational platform.
          - PRONABEC Higher Education Continuity Scholarship recipient.
    TECHNOLOGIES AND SKILLS:
      - label: Backend
        details: C#, .NET, ASP.NET Core, Entity Framework Core, REST APIs and integrations.
      - label: Frontend
        details: React, Next.js, Angular, TypeScript, JavaScript, HTML and CSS.
      - label: Data
        details: SQL Server, PostgreSQL, SQLite and relational data modeling.
      - label: Cloud and delivery
        details: Azure, Bicep, Docker, Git, Azure DevOps, GitHub Actions and CI/CD.
      - label: Quality
        details: xUnit, Vitest, Playwright, Testcontainers, code reviews and Clean Architecture.
      - label: AI-assisted development
        details: Claude Code, Codex, agent workflows and specification-driven development.
      - label: Languages
        details: Spanish - Native · English - B2.
design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.6in
    bottom_margin: 0.6in
    left_margin: 0.5in
    right_margin: 0.5in
    show_top_note: false
    show_footer: false
  typography:
    font_family: XCharter
    alignment: left
    line_spacing: 0.5em
    font_size:
      body: 10.25pt
      name: 25pt
      headline: 10pt
      connections: 10pt
    bold:
      name: true
      headline: true
  links:
    underline: false
  header:
    space_below_name: 0.3cm
    space_below_headline: 0.1cm
    space_below_connections: 0.25cm
    connections:
      space_between_connections: 0.3cm
      show_icons: false
      separator: "·"
      phone_number_format: international
      display_urls_instead_of_usernames: true
  section_titles:
    space_above: 0.45cm
    space_below: 0.25cm
  sections:
    space_between_regular_entries: 0.3cm
    space_between_text_based_entries: 0cm
  entries:
    highlights:
      bullet: ●
      space_left: 0.4cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.45cm
  templates:
    date_range: START_DATE - END_DATE
    experience_entry:
      main_column: "**COMPANY**\nPOSITION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "*LOCATION*\n***DATE***"
    education_entry:
      main_column: "**INSTITUTION**\nAREA\nHIGHLIGHTS"
      date_and_location_column: "*LOCATION*\n***DATE***"
      degree_column: null
    normal_entry:
      main_column: "**NAME**\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "*LOCATION*\n***DATE***"
locale:
  language: english
  present: Present
